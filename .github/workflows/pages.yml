name: verify-and-deploy

# 시험(가짜 엔진으로 화면 전체 흐름) → 통과한 main만 GitHub Pages에 올린다.
# 모델(Whisper turbo int8·CAM++)은 저장소에 넣지 않고, 배포할 때 sherpa-onnx 릴리스에서 받아
# 줄이고(tools/prepare_models.py) 조각으로 나눠 사이트와 함께 올린다. 사이트 밖으로 요청하지 않게 하려는 것.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

env:
  SHERPA_REL: https://github.com/k2-fsa/sherpa-onnx/releases/download
  MODEL_REV: turbo-nbits8-split4-v4
  SILERO_SHA16: 9e2449e1087496d8

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Read the pinned Playwright version
        id: pw
        run: echo "version=$(node -p "require('playwright/package.json').version")" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        id: pwcache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw.outputs.version }}
      - if: steps.pwcache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium
      - if: steps.pwcache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium
      - name: ffmpeg (MP3 조각 풀기 시험용)
        # 우분투 저장소가 멈추면 설치가 끝없이 걸려 배포까지 막힌다(2026-10-10). 4분 넘으면 건너뛰고 ffmpeg 쓰는 시험만 빠진다
        timeout-minutes: 4
        continue-on-error: true
        run: command -v ffmpeg || (sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg)
      - run: npm test

  deploy:
    needs: verify
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts && npm run vendor

      - name: 모델 캐시
        id: models
        uses: actions/cache@v4
        with:
          path: _models
          key: models-${{ env.MODEL_REV }}-${{ hashFiles('tools/prepare_models.py', 'tools/shrink_decoder.py', 'tools/to_nbits.py', 'tools/split_encoder.py') }}

      - name: 모델 받기·줄이기·나누기
        if: steps.models.outputs.cache-hit != 'true'
        run: |
          set -e
          mkdir -p _dl && cd _dl
          curl -sSL -o turbo.tar.bz2 "$SHERPA_REL/asr-models/sherpa-onnx-whisper-turbo.tar.bz2"
          tar xjf turbo.tar.bz2 --wildcards '*int8.onnx' '*tokens.txt'
          curl -sSL -o campplus.onnx "$SHERPA_REL/speaker-recongition-models/3dspeaker_speech_campplus_sv_zh_en_16k-common_advanced.onnx"
          curl -sSL -o silero_vad.onnx "$SHERPA_REL/asr-models/silero_vad.onnx"
          test "$(sha256sum silero_vad.onnx | cut -c1-16)" = "$SILERO_SHA16" || (echo "silero_vad.onnx 해시가 다릅니다" && exit 1)
          cd ..
          pip install -q onnx numpy onnxruntime
          python tools/prepare_models.py _dl/sherpa-onnx-whisper-turbo _dl/campplus.onnx _models _dl/silero_vad.onnx
          rm -rf _dl

      - name: 올릴 파일 모으기
        run: |
          set -e
          mkdir -p _site
          cp web/index.html web/style.css web/sw.js _site/
          cp -r web/src web/vendor web/icons _site/
          cp -r _models _site/models
          touch _site/.nojekyll
          size=$(du -sb _site | cut -f1)
          echo "올라갈 크기: $((size / 1048576)) MB"
          test "$size" -lt 1000000000 || (echo "GitHub Pages 1GB 한도를 넘습니다" && exit 1)

      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deploy
        uses: actions/deploy-pages@v4
